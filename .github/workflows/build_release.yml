name: Build & Release Mahmas Studio APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Production Signing Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring production signing keystore from repository secrets..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat <<EOF > android/key.properties
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'mahmas-key' }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          EOF
            echo "Production keystore configured successfully."
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "::error::Release build triggered by version tag ${{ github.ref_name }} requires ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD repository secrets to be configured."
            exit 1
          else
            echo "No production keystore secrets configured; continuing with standard development build."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}

      - name: Verify Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Get dependencies
        run: flutter pub get

      - name: Run Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahmas-studio-app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MAHMAS Studio ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
