name: Build & Release Mahmas Studio APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Production Signing Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding persistent production signing keystore from secrets..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/mahmas-release.keystore
            cat <<EOF > android/key.properties
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'mahmas-key' }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          storeFile=app/mahmas-release.keystore
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}
          EOF
            echo "Production keystore and key.properties configured successfully."
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "::error::Release build triggered by version tag ${{ github.ref_name }} requires ANDROID_KEYSTORE_BASE64, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD repository secrets to be configured."
            exit 1
          else
            echo "No production keystore secrets configured; continuing with standard development build."
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}

      - name: Verify Production Signing Configuration
        run: |
          if [ -f android/key.properties ] && [ -f android/app/mahmas-release.keystore ]; then
            echo "Keystore size: $(wc -c < android/app/mahmas-release.keystore) bytes"
            echo "Signing configuration verified."
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "::error::Missing production keystore files for release tag build."
            exit 1
          fi

      - name: Run Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK Signature & Production Fingerprint
        run: |
          # 1. Resolve Android SDK Root
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK location: $SDK_DIR"

          # 2. Locate apksigner executable in build-tools dynamically
          APKSIGNER_BIN=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN=$(command -v apksigner)
          elif [ -d "$SDK_DIR/build-tools" ]; then
            APKSIGNER_BIN=$(find "$SDK_DIR/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "$APKSIGNER_BIN" ] || [ ! -f "$APKSIGNER_BIN" ]; then
            echo "::error::Could not find 'apksigner' executable in Android SDK ($SDK_DIR/build-tools)."
            exit 1
          fi

          chmod +x "$APKSIGNER_BIN" || true
          echo "Discovered apksigner at: $APKSIGNER_BIN"
          "$APKSIGNER_BIN" --version || true

          # 3. Verify APK signature
          echo "Verifying release APK signing certificate..."
          APKSIGNER_OUTPUT=$("$APKSIGNER_BIN" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$APKSIGNER_OUTPUT"

          if [ -f android/app/mahmas-release.keystore ]; then
            if echo "$APKSIGNER_OUTPUT" | grep -qi "CN=Android Debug"; then
              echo "::error::Release APK was signed with the Android Debug certificate! Expected Mahmas Studio production certificate."
              exit 1
            fi

            EXPECTED_SHA256="52208b88a16718acbab27c8326869b02ab1aad3f1179da48e5718b26eb405509"
            CLEAN_OUTPUT=$(echo "$APKSIGNER_OUTPUT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            if [[ "$CLEAN_OUTPUT" == *"$EXPECTED_SHA256"* ]]; then
              echo "SUCCESS: Release APK verified with Mahmas Studio production certificate."
            else
              echo "::error::Release APK certificate SHA-256 does not match expected production fingerprint ($EXPECTED_SHA256)."
              exit 1
            fi
          else
            echo "Notice: Build completed without production keystore (development mode)."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahmas-studio-app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MAHMAS Studio ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
