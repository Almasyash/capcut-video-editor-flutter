name: Build & Release Editor FS APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, e.g. v2.4.9"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve & Validate Release Target
        id: release_target
        run: |
          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"
          IS_RELEASE="false"
          RELEASE_TAG=""

          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/v* ]]; then
            IS_RELEASE="true"
            RELEASE_TAG="${{ github.ref_name }}"
            echo "Triggered by Git tag push: $RELEASE_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.release_tag }}"
            RELEASE_TAG=$(echo "$RAW_TAG" | tr -d '[:space:]')
            if [ -n "$RELEASE_TAG" ]; then
              IS_RELEASE="true"
              echo "Triggered by manual workflow_dispatch with requested tag: $RELEASE_TAG"
            fi
          else
            echo "CI build triggered by $EVENT_NAME on $REF (non-release build)."
          fi

          if [ "$IS_RELEASE" = "true" ]; then
            # 1. Validate Tag Format (must be v<major>.<minor>.<patch>)
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+[0-9]+)?$ ]]; then
              echo "::error::MALFORMED TAG: Release tag '$RELEASE_TAG' is invalid. Must match 'v<major>.<minor>.<patch>' (e.g. v2.4.9)."
              exit 1
            fi

            # 2. Extract and Validate pubspec.yaml Version Consistency
            if [ ! -f pubspec.yaml ]; then
              echo "::error::pubspec.yaml not found."
              exit 1
            fi

            PUBSPEC_RAW=$(grep -E '^version:[[:space:]]*' pubspec.yaml | head -n 1 | sed -E 's/^version:[[:space:]]*//' | tr -d '\r\n"')
            PUBSPEC_SEMVER="${PUBSPEC_RAW%%+*}"
            EXPECTED_TAG="v${PUBSPEC_SEMVER}"

            echo "Detected pubspec.yaml version: $PUBSPEC_RAW (semantic: $PUBSPEC_SEMVER)"
            echo "Expected release tag: $EXPECTED_TAG"
            echo "Requested release tag: $RELEASE_TAG"

            if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::VERSION MISMATCH: Requested release tag '$RELEASE_TAG' does not match pubspec.yaml version '$PUBSPEC_RAW' (expected '$EXPECTED_TAG'). Update pubspec.yaml before releasing."
              exit 1
            fi

            # 3. Duplicate Protection: Check if GitHub Release already exists
            echo "Checking if a GitHub Release already exists for $RELEASE_TAG..."
            if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "::error::DUPLICATE RELEASE: A GitHub Release for tag '$RELEASE_TAG' already exists in ${{ github.repository }}. Overwriting or recreating releases is strictly forbidden."
              exit 1
            fi

            # 4. Duplicate Protection: On manual workflow_dispatch, check if Git tag already exists on remote
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "Checking if Git tag $RELEASE_TAG already exists on remote origin..."
              if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q "refs/tags/$RELEASE_TAG"; then
                echo "::error::DUPLICATE TAG: Git tag '$RELEASE_TAG' already exists in repository. Overwriting existing tags is strictly forbidden."
                exit 1
              fi
            fi

            echo "Release validation SUCCESS for $RELEASE_TAG."
            echo "IS_RELEASE=true" >> $GITHUB_ENV
            echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          else
            echo "IS_RELEASE=false" >> $GITHUB_ENV
            echo "RELEASE_TAG=" >> $GITHUB_ENV
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "release_tag=" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Production Signing Keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CRITICAL: ANDROID_KEYSTORE_BASE64 secret is missing in GitHub repository settings. Release builds require production signing credentials."
            exit 1
          fi

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::CRITICAL: ANDROID_STORE_PASSWORD or ANDROID_KEY_PASSWORD secret is missing in GitHub repository settings."
            exit 1
          fi

          echo "Decoding persistent production signing keystore from secrets..."
          mkdir -p android/app
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/mahmas-release.keystore

          cat <<EOF > android/key.properties
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'mahmas-key' }}
          keyPassword=${KEY_PASSWORD}
          storeFile=app/mahmas-release.keystore
          storePassword=${STORE_PASSWORD}
          EOF

          echo "Production keystore and key.properties configured successfully."
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.STORE_PASSWORD }}

      - name: Verify Production Signing Configuration
        run: |
          if [ ! -f android/app/mahmas-release.keystore ]; then
            echo "::error::Keystore file android/app/mahmas-release.keystore was not created."
            exit 1
          fi

          KEYSTORE_SIZE=$(wc -c < android/app/mahmas-release.keystore)
          if [ "$KEYSTORE_SIZE" -lt 100 ]; then
            echo "::error::Keystore file is too small or invalid ($KEYSTORE_SIZE bytes)."
            exit 1
          fi

          if [ ! -f android/key.properties ]; then
            echo "::error::key.properties file was not created."
            exit 1
          fi

          echo "Keystore verified: $KEYSTORE_SIZE bytes"
          echo "key.properties verified."

      - name: Run Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK Signature & Production Fingerprint
        run: |
          # 1. Resolve Android SDK Root
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK location: $SDK_DIR"

          # 2. Locate apksigner executable in build-tools dynamically
          APKSIGNER_BIN=""
          if command -v apksigner >/dev/null 2>&1; then
            APKSIGNER_BIN=$(command -v apksigner)
          elif [ -d "$SDK_DIR/build-tools" ]; then
            APKSIGNER_BIN=$(find "$SDK_DIR/build-tools" -name "apksigner" -type f 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "$APKSIGNER_BIN" ] || [ ! -f "$APKSIGNER_BIN" ]; then
            echo "::error::Could not find 'apksigner' executable in Android SDK ($SDK_DIR/build-tools)."
            exit 1
          fi

          echo "Discovered apksigner at: $APKSIGNER_BIN"
          "$APKSIGNER_BIN" --version || true

          # 3. Strict Verification of APK Signature
          echo "Verifying release APK signing certificate..."
          APKSIGNER_OUTPUT=$("$APKSIGNER_BIN" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$APKSIGNER_OUTPUT"

          if echo "$APKSIGNER_OUTPUT" | grep -qi "CN=Android Debug"; then
            echo "::error::REJECTED: Release APK was signed with the Android Debug certificate! Production release requires the persistent Mahmas Studio certificate."
            exit 1
          fi

          EXPECTED_SHA256="52208b88a16718acbab27c8326869b02ab1aad3f1179da48e5718b26eb405509"
          CLEAN_OUTPUT=$(echo "$APKSIGNER_OUTPUT" | tr -d ': ' | tr '[:upper:]' '[:lower:]')

          if [[ "$CLEAN_OUTPUT" == *"$EXPECTED_SHA256"* ]]; then
            echo "SUCCESS: Release APK strictly verified with official Mahmas Studio production certificate (SHA-256: $EXPECTED_SHA256)."
          else
            echo "::error::REJECTED: Release APK certificate SHA-256 does not match expected production fingerprint ($EXPECTED_SHA256)."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: editor-fs-app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: steps.release_target.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_target.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Editor FS ${{ steps.release_target.outputs.release_tag }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
